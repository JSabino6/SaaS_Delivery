version: '3.9'

services:



  backend:
    container_name: zap_backend
    build: ./API
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
    volumes:
      - ./API:/app # Hot-reload ativado
      - ./logs:/app/logs




  frontend:
    container_name: zap_dashboard
    build: ./Dashboard
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
    volumes:
      - ./Dashboard:/app
      - ./logs:/app/logs